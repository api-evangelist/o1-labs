aid: o1-labs
name: o1 Labs
description: 'o1 Labs (o1Labs) is a zero-knowledge cryptography company and the incubator of Mina Protocol,
  a lightweight blockchain that stays a constant ~22KB using recursive zk-SNARKs. o1 Labs builds the developer
  tooling for privacy-preserving applications: o1js, a TypeScript framework for writing zk-SNARKs and
  zkApps (formerly SnarkyJS); Kimchi, the underlying proof system; mina-signer for transaction signing;
  and Mina Node SDKs for JavaScript, Go, Python, and Rust that talk to the Mina GraphQL API. Developer
  documentation, zkApp guides, and the node/GraphQL API reference are published at docs.minaprotocol.com,
  and all tooling is open source on GitHub under the o1-labs organization.'
